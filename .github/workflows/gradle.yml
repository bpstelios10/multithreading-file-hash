# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by separate terms of service, privacy policy, and support documentation.
# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-gradle
name: multithreading-file-hash Pipeline

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  pages: write
  id-token: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
    ### Checkout the code and set up Java 21 ###
    - uses: actions/checkout@v6
    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'

    ### Build using the gradle wrapper from the codebase ###
    - name: Build with Gradle Wrapper
      run: ./gradlew build

    #    # Upload test reports as artifacts
    #    - name: Upload Test Reports Artifacts
    #      uses: actions/upload-artifact@v4
    #      with:
    #        name: test-reports
    #        path: |
    #          build/reports/tests/test
    #          build/reports/jacoco/test/html

    ### Publish the HTML reports of junit and Jacoco, to be accessible with links from build summary! ###
    - name: Prepare Combined Test+Jacoco Reports Folder
      run: |
        mkdir -p public/${{ github.run_number }}
        cp -r build/reports/tests/test public/${{ github.run_number }}/junit
        cp -r build/reports/jacoco/test/html public/${{ github.run_number }}/jacoco
    - name: Deploy Reports to Pages (+ keep history)
      uses: peaceiris/actions-gh-pages@v4 # https://github.com/peaceiris/actions-gh-pages#readme
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: public
        keep_files: true
    - name: Add Links in Build Summary Page
      run: |
        echo "### Test Reports" >> $GITHUB_STEP_SUMMARY
        echo "- JUnit: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/${{ github.run_number }}/junit/index.html" >> $GITHUB_STEP_SUMMARY
        echo "- JaCoCo: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/${{ github.run_number }}/jacoco/index.html" >> $GITHUB_STEP_SUMMARY

    # Convert the xml files of test results into ctrf files, so that we can publish them in the pipeline summary page
    - name: Convert Reports to CTRF
      if: always()
      run: |
        npx junit-to-ctrf "build/test-results/**/*.xml"
    - name: Publish Test Report
      uses: ctrf-io/github-test-reporter@v1.0.27 # https://github.com/ctrf-io/github-test-reporter
      if: always()
      with:
        report-path: 'ctrf/*.json'
        insights-report: true
        flaky-rate-report: true
        fail-rate-report: true
        slowest-report: true
        # next lines are for comparing with previous reports
        upload-artifact: true
        fetch-previous-results: true
        summary-delta-report: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # Add a comment in each PR with the coverage report. no checks are done here. checks for coverage are part of build
    - name: JaCoCo Report
      uses: madrapps/jacoco-report@v1.7.2 # https://github.com/marketplace/actions/jacoco-report
      if: always()
      id: jacoco
      with:
        title: Code Coverage Report
        paths: build/reports/jacoco/test/jacocoTestReport.xml
        token: ${{ secrets.GITHUB_TOKEN }}
        update-comment: true
        skip-if-no-changes: true
        min-coverage-overall: 85
        min-coverage-changed-files: 85
    # Also add the output of jacoco in the build summary page
    - name: Get the Coverage information
      run: |
        JSON='${{ toJson(steps.jacoco.outputs) }}'
        {
          echo "### JaCoCo Summary"
          echo ""
          echo "| Key | Value |"
          echo "|-----|-------|"
          printf '%s\n' "$JSON" | jq -r 'to_entries[] | "| \(.key) | \(.value) |"'
        } >> $GITHUB_STEP_SUMMARY

  dependency-submission:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v6
    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'

    # Generates and submits a dependency graph, enabling Dependabot Alerts for all project dependencies.
    # See: https://github.com/gradle/actions/blob/main/dependency-submission/README.md
    - name: Generate and submit dependency graph
      uses: gradle/actions/dependency-submission@v5
      with:
        build-scan-publish: true
        build-scan-terms-of-use-url: "https://gradle.com/help/legal-terms-of-use"
        build-scan-terms-of-use-agree: "yes"
