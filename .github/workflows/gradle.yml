# separate terms of service, privacy policy, and support
# documentation.
# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-gradle
name: multithreading-file-hash Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Build with Gradle Wrapper
      run: ./gradlew build

#    - name: Setup Pages
#      uses: actions/configure-pages@v5
#
#    - name: Upload Test Report
#      uses: actions/upload-pages-artifact@v3
#      with:
#        path: 'build/reports/tests/test/'
#
#    - name: Deploy to GitHub Pages
#      if: github.ref == 'refs/heads/main' # Only runs on the main branch
#      id: deployment
#      uses: actions/deploy-pages@v4
    - name: Convert Reports to CTRF
      if: always()
      run: |
        npx junit-to-ctrf "build/test-results/**/*.xml"
        npx jacoco-to-ctrf "build/reports/jacoco/test/*.xml"

    - name: Publish Test Report
      uses: ctrf-io/github-test-reporter@v1
      if: always()
      with:
        report-path: 'ctrf/*.json'
        summary-delta-report: true
        insights-report: true
        flaky-rate-report: true
        fail-rate-report: true
        slowest-report: true
#
#    - name: Add coverage to PR
#      id: jacoco
#      uses: madrapps/jacoco-report@v1.7.2
#      with:
#        paths: |
#          ${{ github.workspace }}/**/build/reports/jacoco/test/jacocoTestReport.xml

  dependency-submission:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    # Generates and submits a dependency graph, enabling Dependabot Alerts for all project dependencies.
    # See: https://github.com/gradle/actions/blob/main/dependency-submission/README.md
    - name: Generate and submit dependency graph
      uses: gradle/actions/dependency-submission@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0
      with:
        build-scan-publish: true
        build-scan-terms-of-use-url: "https://gradle.com/help/legal-terms-of-use"
        build-scan-terms-of-use-agree: "yes"
