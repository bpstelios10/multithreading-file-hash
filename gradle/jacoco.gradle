check.dependsOn jacocoTestCoverageVerification
jacocoTestReport {
    reports {
        xml.required = true
        html.required = true
    }

    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: [
                    "**/ServiceApplication.class",
                    "org/learnings/**/*DTO.*",
                    "**/config/*"
            ])
        }))
    }
}

jacocoTestCoverageVerification {
    dependsOn jacocoTestReport
    violationRules {
        rule {
            element = 'BUNDLE'
            limit {
                counter = 'INSTRUCTION' // bytecode precision
                minimum = 0.97
            }
            limit {
                counter = 'LINE' // most straight-forward to see
                minimum = 0.97
            }
            limit {
                counter = 'BRANCH' // is the hardest to 'cheat'
                minimum = 0.93
            }
            limit {
                counter = 'COMPLEXITY' // complex paths hits
                minimum = 0.95
            }
        }
    }
}
